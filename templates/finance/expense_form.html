{% extends "base.html" %}
{% block content %}

<div class="col-md-6 mx-auto">
    <div class="card shadow">
        <div class="card-body">
            <h4>Add Expense</h4>

            <form method="post">
                {% csrf_token %}

                <select class="form-control mb-3" name="account">
                    {% for w in wallet %}
                        <option value="{{ w.id }}">{{ w.name }}</option>
                    {% endfor %}
                </select>

                <select class="form-control mb-3" name="category">
                    {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>

                <input class="form-control mb-3" name="ammount" type="number" step="0.01" placeholder="Amount">

                <select class="form-control mb-3" name="currency">
                    <option value="UZS">So‘m</option>
                    <option value="USD">Dollar</option>
                    <option value="RUB">Rubl</option>
                </select>

                <button class="btn btn-danger w-100">Save</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
