{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="text-center mb-4 fw-bold text-success">Kirim Ma'lumotlarini Kiriting</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Hamyonni tanlang</label>
                    <select name="account" class="form-select" required>
                        {% for w in wallet %}
                        <option value="{{ w.id }}">{{ w.name }} ({{ w.balance }} {{ w.currency }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Kategoriya</label>
                    <select name="category" class="form-select" required>
                        {% for c in categories %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Miqdor</label>
                    <input type="number" step="0.01" name="ammount" class="form-control" placeholder="0.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valyuta</label>
                    <select name="currency" class="form-select">
                        <option value="UZS">Som</option>
                        <option value="USD">Dollar</option>
                        <option value="RUB">Ruble</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mt-3 shadow">Saqlash</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
