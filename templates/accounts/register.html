{% load i18n %}
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center;">

<div class="auth-card text-center shadow-lg p-5 bg-white rounded-4" style="max-width: 400px; width: 100%;">
    <h2 class="fw-bold mb-4 text-dark">{% trans "Register" %}</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="username" class="form-control form-control-lg border-2" placeholder="{% trans 'Username' %}" required>
        </div>
        <div class="mb-4">
            <input type="password" name="password" class="form-control form-control-lg border-2" placeholder="{% trans 'Password' %}" required>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mb-3">{% trans "Register" %}</button>
    </form>

    <p class="text-muted">
        {% trans "Already have an account?" %} <a href="{% url 'login' %}" class="text-decoration-none fw-bold">{% trans "Login" %}</a>
    </p>
</div>
</body>
