{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Login" %} | FinanceApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 400px; padding: 40px; }
        .form-control { border-radius: 10px; padding: 12px; border: 2px solid #eee; }
        .form-control:focus { box-shadow: none; border-color: #764ba2; }
        .btn-auth { background: #764ba2; border: none; border-radius: 10px; padding: 12px; font-weight: bold; transition: 0.3s; }
        .btn-auth:hover { background: #5a377d; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <div class="mb-4">
        <i class="fas fa-wallet fa-3x text-primary"></i>
        <h2 class="fw-bold mt-2">{% trans "Login" %}</h2>
        <p class="text-muted small">{% trans "Xush kelibsiz! Tizimga kiring." %}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Username' %}" required>
            </div>
        </div>
        <div class="mb-4">
            <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Password' %}" required>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-auth text-white w-100 mb-3">{% trans "Login" %}</button>
    </form>

    <p class="mb-0 small text-muted">
        {% trans "No account?" %} <a href="{% url 'register' %}" class="text-primary fw-bold">{% trans "Register" %}</a>
    </p>
</div>

</body>
</html>
